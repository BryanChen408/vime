# [双机 layout] 训练 8 卡在 .56;rollout 16 卡在 .57(PD 分离 1P3D)。
#
# 卡位:
#   80.48.5.56  0-7   actor 训练(同一 HCCS 域,不跨 7/8 边界 → 免 EI0013 跨域 RoCE)
#   80.48.5.56  8-15  polar agent/judge 预留(宿主机子容器用,**不进 vime ray**)
#   80.48.5.57  0-15  rollout:prefill 4 卡(tp4×1)+ decode 12 卡(tp4×3),由 vllm_config
#                     server_groups 顺序决定,见 vllm_qwen36_35b_polar_single56_pd_mooncake_rollout_only.yaml
#
# device 号必须对上各节点 ASCEND_RT_VISIBLE_DEVICES 暴露的物理卡:
#   .56 只给 vime 暴露 0-7;.57 暴露 0-15。ASCEND_RT_VISIBLE_DEVICES 必须升序(Ascend 硬约束)。
#
# 启动(两台跑同一个脚本,靠 CURRENT_IP==MASTER_ADDR 分角色):
#   head@56:   CURRENT_IP=80.48.5.56 MASTER_ADDR=80.48.5.56 NPUS_PER_NODE=8  ASCEND_RT_VISIBLE_DEVICES=0-7
#   worker@57: CURRENT_IP=80.48.5.57 MASTER_ADDR=80.48.5.56 NPUS_PER_NODE=16 ASCEND_RT_VISIBLE_DEVICES=0-15
#   (脚本按角色自动填上述默认值,一般无需显式传)
#
# 权重同步:.56 actor(8)→ 跨机 HCCL →.57 rollout(16),world_size = 8 + 16 = 24。
#   这是本拓扑最大的新风险面:此前 PD 只在单机内跑过,跨机 weight-sync + 跨机 KV 都是首次。
#
# PD proxy 落点:layout 路径下 create_rollout_manager(placement_group.py:317)把 RolloutManager
#   钉在 rollout 的第一个 bundle 上 → proxy 起在 **.57**,不是 head。故 polar 的
#   sglang_router_url 必须指 http://80.48.5.57:8001(与 rollout-only 双机方案相反)。
roles:
  actor:
    - {node: 80.48.5.59, devices: "0-7"}
  rollout:
    - {node: 80.48.5.56, devices: "0-15"}
  polar_reserved:                      # 仅供 overlap 校验与文档;隔离靠 .56 只暴露 0-7 给 vime
    - {node: 80.48.5.59, devices: "8-11"}
rollout:
  num_gpus_per_engine: 4               # 16 卡 → 4 个 tp4 engine(1 prefill + 3 decode)
