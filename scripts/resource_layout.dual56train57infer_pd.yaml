
roles:
  actor:
    - {node: 80.5.25.141, devices: "0-15"}
  rollout:
    - {node: 80.5.25.140, devices: "4-7"}
  polar_reserved:
    - {node: 80.5.25.140, devices: "0-3"}      # ← 补上
rollout:
  num_gpus_per_engine: 2                 # 4 卡 → 2 个 tp2 engine(P=4-5 / D=6-7,同 HCCS 域);对应 PD 4卡 yaml
  vllm_dp_size: 2                         # external-LB DP 组大小 = 引擎数(rollout 卡数 / num_gpus_per_engine = 4/2 = 2)。
                                          #   仅 FEAT_DP_EXTERNAL_LB=1 时生效(基线忽略);须 == 引擎数,否则 arguments.py 报错。
                                          #   改 num_gpus_per_engine 时此处同步改(如 TP8 → vllm_dp_size:2)。
