# [8卡 PD / 1P1D] 140 节点 rollout 8 卡(devices 8-15)→ prefill 4(tp4×1)+ decode 4(tp4×1)。
# 逐字派生自 vllm_qwen36_35b_polar_single56_pd_mooncake_rollout_only.yaml,唯一实质改动:
#   decode.num_gpus 12 → 4(16卡单机是 1P3D;双机 rollout 仅 8 卡,PD 下只能 1P1D)。
# decode 侧 overrides 全保留(FULL_DECODE_ONLY / fused_mc2 / recompute_scheduler / npugraph_ex 都是 decode 提速项)。
# per_engine=4 与 start_pd.sh 的 ROLLOUT_NUM_GPUS_PER_ENGINE 一致;两组各 1 个 tp4 引擎,不跨 HCCS 域。
vllm:
  - name: default
    update_weights: true
    server_groups:
      - worker_type: prefill
        num_gpus: 4
        num_gpus_per_engine: 4
        overrides:
          disable_hybrid_kv_cache_manager: false
          enable_prefix_caching: true
          pd_topology:
            prefill:
              dp_size: 1
              tp_size: 4
            decode:
              dp_size: 1
              tp_size: 4
          additional_config:
            enable_flashcomm1: true
            enable_fused_mc2: 0
            enable_cpu_binding: true
            ascend_compilation_config:
              enable_npugraph_ex: false
      - worker_type: decode
        num_gpus: 4
        num_gpus_per_engine: 4
        overrides:
          disable_hybrid_kv_cache_manager: false
          enable_prefix_caching: true
          max_model_len: 131072
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
          pd_topology:
            prefill:
              dp_size: 1
              tp_size: 4
            decode:
              dp_size: 1
              tp_size: 4
          additional_config:
            enable_flashcomm1: false
            enable_fused_mc2: 1
            enable_cpu_binding: true
            recompute_scheduler_enable: true
            ascend_compilation_config:
              enable_npugraph_ex: true
