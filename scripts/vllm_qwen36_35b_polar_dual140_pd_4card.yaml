# [4卡 PD / 1P1D] 140 节点 rollout 4 卡(devices 4-7)→ prefill 2(tp2×1,卡4-5)+ decode 2(tp2×1,卡6-7)。
# 派生自 vllm_qwen36_35b_polar_dual140_pd_8card.yaml,实质改动:num_gpus/num_gpus_per_engine/tp_size 4→2。
# P/D 同处 HCCS 域 4-7(同域建链,规避跨域 RoCE/超时坑,是 4 卡下最稳的 PD 形态)。
# per_engine=2 必须与 start_pd.sh 的 ROLLOUT_NUM_GPUS_PER_ENGINE=2 一致。
vllm:
  - name: default
    update_weights: true
    server_groups:
      - worker_type: prefill
        num_gpus: 2
        num_gpus_per_engine: 2
        overrides:
          disable_hybrid_kv_cache_manager: false
          enable_prefix_caching: true
          pd_topology:
            prefill:
              dp_size: 1
              tp_size: 2
            decode:
              dp_size: 1
              tp_size: 2
          additional_config:
            enable_flashcomm1: true
            enable_fused_mc2: 0
            enable_cpu_binding: true
            ascend_compilation_config:
              enable_npugraph_ex: false
      - worker_type: decode
        num_gpus: 2
        num_gpus_per_engine: 2
        overrides:
          disable_hybrid_kv_cache_manager: false
          enable_prefix_caching: true
          # 必须 == 全局 262144:写小(如 131072)会让超长的 polar 会话被 decode 直接
          # 400 拒掉(131159 run 里 176 次),session 全 ERROR 白跑。KV 按需分配,
          # 提上限不占静态显存;KV 满了请求排队(waiting)而不是报错。
          max_model_len: 262144
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
          pd_topology:
            prefill:
              dp_size: 1
              tp_size: 2
            decode:
              dp_size: 1
              tp_size: 2
          additional_config:
            enable_flashcomm1: false
            enable_fused_mc2: 1
            enable_cpu_binding: true
            recompute_scheduler_enable: true
            ascend_compilation_config:
              enable_npugraph_ex: true
